services:
  gocart:
    build:
      context: ./
      dockerfile: dockerfile
    container_name: go-cart
    ports:
      - 3001:3000
    restart: always
    volumes:
      - gocart-data:/app
      - log-data:/app/logs
    networks:
      - app-network

networks:
  app-network:
    external: true

volumes:
  gocart-data:
  log-data: